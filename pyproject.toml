[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todoist-labels"
version = "0.1.0"
description = "Пошук релевантних міток Todoist за текстом контексту"
requires-python = ">=3.9"
dependencies = ["todoist-api-python", "thefuzz"]

[project.optional-dependencies]
semantic = ["sentence-transformers"]

[project.scripts]
todoist-labels = "todoist_labels.cli:main"

[tool.setuptools]
packages = ["todoist_labels"]
